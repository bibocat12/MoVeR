# MoVeR follows the EV-UAV repository's flat sectioned YAML format.
# One archive/clip is one isolated forward sample (batch_size=1).
STRUCTURE:
  model_name: mover
  c_stem: 64
  c_graph: 16
  k: 8

DATA:
  root: data/EV-UAV
  whole_t: 8000
  res: [346, 260]
  normalization_path: configs/train_normalization.json
  max_events_num: null
  event_feature_channels: 4
  tau_scale: 64.0
  n_blocks: 32

TRAIN:
  epochs: 120
  batch_size: 1
  train_workers: 0
  optim: AdamW
  lr: 0.0002
  weight_decay: 0.01
  lovasz_w: 0.15
  lambda_v: 0.02
  pre_weight: 0.10
  seed: 37
  model_save_root: checkpoints/mover

TEST:
  eval: true
  roc: false
  threshold: 0.90
  pd_detT: 50.0
  correct_thresh: 0.0001
  model_path: checkpoints/mover/best.pt
  save: true
  output_root: results/mover
  deterministic: false
  warmup: 10
  repeats: 50
  split: test
